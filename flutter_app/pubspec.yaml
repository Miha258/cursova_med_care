name: medcare_crm
description: MedCare CRM — Система управління лікарнею (Flutter + BLoC + NestJS)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management (BLoC)
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # HTTP Client (dio з Interceptor для JWT auto-refresh)
  dio: ^5.4.0

  # Secure storage (JWT + Refresh Token, шифрований сховище)
  flutter_secure_storage: ^9.0.0

  # Dependency injection
  get_it: ^7.6.7

  # Navigation
  go_router: ^12.1.3

  # Calendar widget
  table_calendar: ^3.0.9

  # Charts (фінансові звіти)
  fl_chart: ^0.66.2

  # Date formatting (локалізація ua)
  intl: ^0.18.1

  # Icons + UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0

  # Firebase Push Notifications (FCM)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Utils
  shared_preferences: ^2.5.5
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.5
  mocktail: ^1.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
